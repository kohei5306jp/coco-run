<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>鬼怒川もみじクエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#131834;--bg2:#1c2346;--panel:#222b54;--line:#2f3a6b;--ink:#f4f1ea;--muted:#9aa3c7;
  --or:#ff8a3d;--gold:#ffc94a;--red:#ff5a4e;--green:#3ddc97;--pink:#ff6fae;--blue:#5fb4ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{font-family:'M PLUS Rounded 1c',-apple-system,sans-serif;color:var(--ink);font-weight:500;-webkit-text-size-adjust:100%}
button{font-family:inherit;touch-action:manipulation;cursor:pointer;border:none;color:inherit}
input,textarea{font-family:inherit;font-size:16px}
.dg{font-family:'Dela Gothic One',sans-serif;font-weight:400;letter-spacing:.02em}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

header{background:linear-gradient(135deg,#2a1d4f 0%,#4a1f3d 55%,#7a2a2a 100%);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;flex-shrink:0;position:relative;overflow:hidden;border-bottom:1px solid #3b2c5e}
header::after{content:"🍁";position:absolute;right:52px;top:-10px;font-size:70px;opacity:.13;transform:rotate(20deg)}
.hrow{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.hav{font-size:28px;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid rgba(255,255,255,.2)}
.hname{flex:1;min-width:0}
.hname b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hname span{font-size:12px;color:var(--gold)}
.hpt{text-align:right}
.hpt b{font-size:24px;line-height:1;color:var(--gold)}
.hpt small{display:block;font-size:10px;color:var(--muted)}
.hgear{background:rgba(255,255,255,.12);width:34px;height:34px;border-radius:10px;font-size:15px;flex-shrink:0}
.hbar{height:6px;background:rgba(255,255,255,.12);border-radius:9px;margin-top:9px;overflow:hidden;position:relative;z-index:1}
.hbar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--gold));border-radius:9px;transition:width .6s}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 12px 26px}
.view{display:none}.view.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:19px;margin:6px 2px 12px;display:flex;align-items:center;gap:8px}
h2 small{font-family:'M PLUS Rounded 1c';font-size:12px;color:var(--muted);font-weight:700}
.box{background:var(--panel);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}

nav{display:flex;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);flex-shrink:0}
nav button{flex:1;background:none;padding:8px 0 6px;color:var(--muted);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:21px;filter:grayscale(.8);opacity:.6}
nav button.on{color:var(--gold)}
nav button.on i{filter:none;opacity:1}

/* schedule */
.count{text-align:center;background:linear-gradient(135deg,#2d2560,#4b2347);border:1px solid #5a3b78}
.count .s{font-size:12.5px;color:var(--muted)}
.count .big{font-size:26px;margin:4px 0;color:var(--gold)}
.dayttl{font-size:15px;margin:18px 4px 8px;color:var(--or)}
.ti{display:flex;gap:10px;position:relative;padding-bottom:12px}
.ti::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--line)}
.ti:last-child::before{display:none}
.tdot{width:40px;height:40px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;z-index:1}
.tbody{flex:1;background:var(--panel);border-radius:14px;padding:9px 12px;border:1px solid var(--line)}
.ttime{font-size:13px;font-weight:800;color:var(--or)}
.tttl{font-size:15px;font-weight:800;margin:1px 0}
.tsub{font-size:12px;color:var(--muted);line-height:1.5}
.tchip{display:inline-block;margin-top:7px;font-size:11.5px;background:rgba(255,138,61,.15);color:var(--or);padding:4px 10px;border-radius:20px;font-weight:800}
.ti.past{opacity:.45}
.ti.now .tdot{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,201,74,.2);animation:pulse 1.6s infinite}
.ti.now .tbody{border:2px solid var(--gold)}
.nowtag{display:inline-block;background:var(--gold);color:#2a1d0a;font-size:10.5px;padding:1px 7px;border-radius:9px;margin-left:6px;vertical-align:2px}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(255,201,74,.05)}}

/* alert */
.alert{display:block;width:100%;text-align:left;background:linear-gradient(135deg,#ff5a4e,#ff8a3d);border-radius:16px;padding:12px 14px;margin-bottom:12px;color:#fff;animation:blink 1.4s infinite;box-shadow:0 4px 18px rgba(255,90,78,.35)}
.alert b{display:block;font-size:13px}
.alert span{display:block;font-size:16px;font-weight:800;margin-top:2px}
.alert small{font-size:12px;opacity:.9}
@keyframes blink{50%{box-shadow:0 4px 30px rgba(255,90,78,.7)}}

/* missions */
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;margin-bottom:12px;border:1px solid var(--line)}
.seg button{flex:1;background:none;padding:9px 4px;border-radius:10px;font-weight:800;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--gold)}
.rules{font-size:12.5px;line-height:1.7;background:rgba(255,201,74,.1);border:1px solid rgba(255,201,74,.3);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.mphase{font-size:12.5px;font-weight:800;color:var(--muted);margin:16px 4px 6px}
.mi{display:flex;align-items:center;gap:11px;background:var(--panel);border-radius:14px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left;border:1px solid var(--line)}
.mi .me{width:48px;height:48px;border-radius:12px;background:var(--bg2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.mi .mt{flex:1;min-width:0}
.mi .mt b{font-size:15px;display:block;font-weight:800}
.mi .mt span{font-size:12px;color:var(--muted)}
.mi .mp{font-size:12px;font-weight:800;color:#fff;padding:4px 8px;border-radius:9px;flex-shrink:0}
.mi.done{border-color:rgba(61,220,151,.5);background:linear-gradient(90deg,rgba(61,220,151,.12),var(--panel))}
.mi.done .mp{background:var(--green)!important;color:#0d2a1e}
.mi.lock{opacity:.5}
.rN{background:#6c7499}.rR{background:#5f86c9}.rSR{background:linear-gradient(90deg,#d99a12,#ffc94a);color:#3a2600!important}.rUR{background:linear-gradient(90deg,#ff5a8a,#ffb84a,#4fe3a8,#4fa8ff,#b06bff)}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:8px;margin-left:4px;vertical-align:1px;font-weight:800}

/* guerrilla list */
.gi{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left}
.gi .gt{font-size:12px;color:var(--muted);font-weight:800;width:62px;flex-shrink:0;line-height:1.3}
.gi .gb{flex:1;font-size:14px;font-weight:800}
.gi .gs{font-size:12px;flex-shrink:0}
.gi.act{border:2px solid var(--red);background:rgba(255,90,78,.12)}
.gi.done{border-color:rgba(61,220,151,.5)}

/* cards */
.zstat{display:flex;gap:8px;margin-bottom:12px}
.zstat div{flex:1;background:var(--panel);border-radius:12px;padding:8px 4px;text-align:center;border:1px solid var(--line)}
.zstat b{display:block;font-size:20px;color:var(--gold)}
.zstat span{font-size:10.5px;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.cgrid>button{padding:0;background:none}
.tcard{position:relative;aspect-ratio:63/88;border-radius:9px;padding:4px;background:#5a6182;overflow:hidden;width:100%;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.tcard .in{position:absolute;inset:4px;border-radius:6px;background:#fdfaf3;color:#2a2238;display:flex;flex-direction:column;overflow:hidden}
.tcard .tn{font-size:9px;font-weight:800;padding:3px 4px 2px;display:flex;justify-content:space-between;gap:2px;white-space:nowrap}
.tcard .tn span{overflow:hidden;text-overflow:ellipsis}
.tcard .tn em{font-style:normal;color:var(--red)}
.tcard .ta{flex:1;margin:0 3px;border-radius:4px;background:#efe6d8 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:30px}
.tcard .tf{font-size:8px;padding:2px 4px 3px;display:flex;justify-content:space-between;color:#8a7f95}
.tcard.c-R{background:linear-gradient(135deg,#cfe0ff,#5f86c9,#e4eeff,#4e72b5)}
.tcard.c-SR{background:linear-gradient(135deg,#ffeaa8,#d99a12,#fff3c4,#b07d10)}
.tcard.c-UR{background:linear-gradient(135deg,#ff9aa2,#ffd28a,#9de3b6,#9cc7ff,#d6a6ff)}
.tcard.c-SR::after,.tcard.c-UR::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.7) 45%,transparent 60%);background-size:250% 100%;animation:shine 2.8s infinite;pointer-events:none;mix-blend-mode:soft-light}
.tcard.c-UR::after{background:linear-gradient(115deg,transparent 20%,rgba(255,120,200,.55) 35%,rgba(120,220,255,.55) 50%,rgba(255,240,120,.55) 65%,transparent 80%);background-size:250% 100%;mix-blend-mode:overlay}
@keyframes shine{0%{background-position:150% 0}100%{background-position:-100% 0}}
.tcard.locked{background:#2a3260;box-shadow:none}
.tcard.locked .in{background:repeating-linear-gradient(45deg,#232b55,#232b55 6px,#1f2750 6px,#1f2750 12px);align-items:center;justify-content:center}
.tcard.locked .q{font-size:28px;color:#3c4782;font-family:'Dela Gothic One'}
.tcard.locked .qn{font-size:9px;color:#4a5694;margin-top:2px}
.tcard.big{width:min(76vw,300px);padding:7px;border-radius:14px}
.tcard.big .in{inset:7px;border-radius:9px}
.tcard.big .tn{font-size:15px;padding:7px 9px 5px}
.tcard.big .ta{font-size:80px;margin:0 7px;border-radius:7px}
.tcard.big .tf{font-size:12px;padding:5px 9px 7px}
.tflav{font-size:12px;line-height:1.5;padding:4px 9px 0;color:#4d4257}

/* quiz */
.qwrap{text-align:center}
.qprog{font-size:13px;color:var(--muted);margin-bottom:6px}
.qq{font-size:19px;font-weight:800;line-height:1.55;margin:8px 0 16px;min-height:60px}
.qopt{display:block;width:100%;padding:14px;margin-bottom:9px;border-radius:14px;background:var(--panel);border:2px solid var(--line);font-size:16px;font-weight:800;text-align:left}
.qopt.ok{border-color:var(--green);background:rgba(61,220,151,.18)}
.qopt.ng{border-color:var(--red);background:rgba(255,90,78,.15)}
.qexp{font-size:13.5px;line-height:1.7;background:var(--bg2);border-radius:12px;padding:10px 12px;margin:6px 0 12px;text-align:left}
.qbig{font-size:64px;color:var(--gold);line-height:1.1}

/* album & results */
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.agrid button{aspect-ratio:1;border-radius:8px;background:#2a3260 center/cover no-repeat;position:relative;padding:0}
.agrid button span{position:absolute;left:3px;bottom:3px;font-size:13px;background:rgba(0,0,0,.55);border-radius:6px;padding:0 4px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-size:16px;font-weight:800;color:#2a1600;background:linear-gradient(135deg,var(--gold),var(--or));box-shadow:0 3px 0 #b85a1c}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b85a1c}
.btn.sub{background:var(--panel);color:var(--ink);box-shadow:0 3px 0 #10142b;border:1px solid var(--line)}
.btn.red{background:linear-gradient(135deg,#ff5a4e,#ff8a3d);color:#fff}
.btn+.btn{margin-top:10px}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:24px 10px;line-height:1.8}
.titles{display:flex;flex-wrap:wrap;gap:6px}
.title{font-size:12.5px;font-weight:800;padding:6px 10px;border-radius:20px;background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.title.on{background:rgba(255,201,74,.15);border-color:var(--gold);color:var(--gold)}
.res{text-align:center;padding:10px 0}
.res .av{font-size:80px;line-height:1}
.res .nm{font-size:28px;margin-top:6px}
.res .pt{font-size:56px;color:var(--gold);line-height:1.1;margin-top:8px}
.res .rk{font-size:18px;color:var(--or);margin-top:4px}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(5,8,20,.7);display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.on{display:flex;animation:fade .2s}
.sheet{background:var(--bg2);width:100%;max-width:520px;max-height:92dvh;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative;border-top:1px solid var(--line)}
.ov.center{align-items:center}
.ov.center .sheet{border-radius:22px;width:92%;text-align:center;border:1px solid var(--line)}
.x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:10px;background:var(--panel);font-size:15px}
.mhead{display:flex;gap:12px;align-items:center;margin:4px 40px 12px 0}
.mhead .me{font-size:40px}
.mhead b{font-size:19px;display:block;margin-bottom:3px}
.mdesc{font-size:14.5px;line-height:1.75;margin-bottom:10px}
.note{font-size:12.5px;background:rgba(255,90,78,.12);border:1px solid rgba(255,90,78,.35);border-radius:10px;padding:8px 10px;margin-bottom:10px;line-height:1.6}
.hint{font-size:12.5px;background:rgba(95,180,255,.1);border:1px solid rgba(95,180,255,.3);border-radius:10px;padding:8px 10px;margin-bottom:10px;line-height:1.6}
.preview{width:100%;border-radius:14px;margin-bottom:10px;display:block}
textarea,.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--panel);color:var(--ink);margin-bottom:10px}
textarea{min-height:90px;resize:none}
.stars{display:flex;justify-content:center;gap:6px;margin:4px 0 12px}
.stars button{font-size:34px;background:none;filter:grayscale(1);opacity:.35}
.stars button.on{filter:none;opacity:1}
.counter{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 12px}
.counter button{width:62px;height:62px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:30px;font-weight:800}
.counter b{font-size:56px;color:var(--gold);min-width:90px;text-align:center}
.field{margin-bottom:12px;text-align:left}
.field label{font-size:13px;font-weight:800;display:block;margin-bottom:6px}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.avs button{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 0;font-size:28px}
.avs button.on{border-color:var(--gold);background:rgba(255,201,74,.12)}
.reveal{perspective:1000px;margin:6px auto 10px;display:inline-block}
.flip{animation:flip 1.1s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes flip{0%{transform:rotateY(180deg) scale(.6)}100%{transform:rotateY(0) scale(1)}}
.rtitle{font-size:22px;color:var(--gold);margin-top:4px}
.rsub{font-size:13px;color:var(--muted);margin:4px 0 12px}
.leaf{position:fixed;top:-40px;z-index:99;pointer-events:none;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:800;z-index:120;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:.9}
#memImg{width:100%;border-radius:12px;-webkit-touch-callout:default}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <div class="hav" id="hAv">🍁</div>
      <div class="hname"><b class="dg" id="hName">鬼怒川もみじクエスト</b><span id="hRank">プレイヤー登録しよう</span></div>
      <div class="hpt"><b class="dg" id="hPt">0</b><small>POINT</small></div>
      <button class="hgear" id="gear" aria-label="設定">⚙️</button>
    </div>
    <div class="hbar"><i id="hBar" style="width:0"></i></div>
  </header>
  <main id="main">
    <section class="view on" id="v-plan"></section>
    <section class="view" id="v-mission"></section>
    <section class="view" id="v-quiz"></section>
    <section class="view" id="v-zukan"></section>
    <section class="view" id="v-album"></section>
  </main>
  <nav>
    <button data-v="plan" class="on"><i>🗓️</i>しおり</button>
    <button data-v="mission"><i>🎯</i>ミッション</button>
    <button data-v="quiz"><i>🧠</i>クイズ</button>
    <button data-v="zukan"><i>🃏</i>ずかん</button>
    <button data-v="album"><i>🏆</i>アルバム</button>
  </nav>
</div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<input type="file" accept="image/*" id="fileIn" style="display:none">
<div class="toast" id="toast"></div>

<script>
/* ===================== データ ===================== */
const SCHEDULE=[
 {id:'d1-train1',d:'2026-11-14',hm:'08:03',lb:'8:03',e:'🚄',t:'北千住駅 出発',s:'スペーシアX1号（東武日光行き）'},
 {id:'d1-imaichi',d:'2026-11-14',hm:'09:30',lb:'9:30',e:'🚉',t:'下今市駅 到着',s:'〜少し休憩〜'},
 {id:'d1-train2',d:'2026-11-14',hm:'10:04',lb:'10:04',e:'🚃',t:'下今市駅 出発',s:'東武鬼怒川線（新藤原行き）'},
 {id:'d1-kinugawa',d:'2026-11-14',hm:'10:26',lb:'10:26',e:'♨️',t:'鬼怒川温泉駅 到着',s:'ホテルへ向かうよ'},
 {id:'d1-hotel',d:'2026-11-14',hm:'11:00',lb:'11:00',e:'🏨',t:'日光きぬ川ホテル三日月 到着',s:'ウェルカムランチ（11:00〜16:00）'},
 {id:'d1-free',d:'2026-11-14',hm:'12:30',lb:'午後',e:'🏊',t:'自由時間（自由研究）',s:'🏊 プール 10:00〜18:00（最終入場17:00）／🏓 アクティビティ／♨️ 温泉'},
 {id:'d1-dinner',d:'2026-11-14',hm:'18:00',lb:'18:00頃',e:'🍽️',t:'ディナービュッフェ',s:'最終21:00 ／ そのあと自由時間'},
 {id:'d1-yashoku',d:'2026-11-14',hm:'21:30',lb:'21:30',e:'🌙',t:'ナイトタイム夜食',s:'21:30〜22:30'},
 {id:'d2-breakfast',d:'2026-11-15',hm:'07:30',lb:'7:30頃',e:'🍳',t:'朝食ビュッフェ',s:'7:00〜9:00'},
 {id:'d2-checkout',d:'2026-11-15',hm:'10:00',lb:'10:00',e:'👋',t:'チェックアウト',s:'自由時間／🏊 プール／🏓 アクティビティ／🌿 鬼怒川散策'},
 {id:'d2-lunch',d:'2026-11-15',hm:'12:00',lb:'12:00頃',e:'🍛',t:'ウェルカムランチ',s:'11:00〜 ／ そのあと自由時間'},
 {id:'d2-train',d:'2026-11-15',hm:'15:19',lb:'15:19',e:'🚄',t:'鬼怒川温泉駅 出発',s:'スペーシアX8号（浅草行き）'},
 {id:'d2-home',d:'2026-11-15',hm:'17:21',lb:'17:21',e:'🏠',t:'北千住駅 到着',s:'おつかれさま！'},
];

const mem={};let dbp=null;
function db(){if(dbp)return dbp;dbp=new Promise(res=>{try{const r=indexedDB.open('kinugawaQuestPhotos2',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null)}});return dbp;}
async function putPhoto(k,b){mem[k]=b;const d=await db();if(!d)return;try{await new Promise((ok,ng)=>{const tx=d.transaction('p','readwrite');tx.objectStore('p').put(b,k);tx.oncomplete=ok;tx.onerror=ng;})}catch(e){}}
async function getPhoto(k){if(mem[k])return mem[k];const d=await db();if(!d)return null;try{return await new Promise(ok=>{const q=d.transaction('p').objectStore('p').get(k);q.onsuccess=()=>{if(q.result)mem[k]=q.result;ok(q.result||null)};q.onerror=()=>ok(null);})}catch(e){return null}}
async function clearPhotos(){for(const k in mem)delete mem[k];const d=await db();if(!d)return;try{d.transaction('p','readwrite').objectStore('p').clear()}catch(e){}}
const urlCache={};
async function photoURL(k){if(urlCache[k])return urlCache[k];const b=await getPhoto(k);if(!b)return null;return urlCache[k]=URL.createObjectURL(b);}
function dropURL(k){if(urlCache[k]){URL.revokeObjectURL(urlCache[k]);delete urlCache[k];}}

const $=s=>document.querySelector(s);

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),1800);}
let AC=null;
function chime(seq=[523,659,784,1047]){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();seq.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;const t=AC.currentTime+i*.1;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.4);})}catch(e){}}
function leaves(n=26,set=['🍁','🍂','✨']){for(let i=0;i<n;i++){const l=document.createElement('div');l.className='leaf';l.textContent=set[i%set.length];l.style.left=Math.random()*100+'vw';l.style.fontSize=(18+Math.random()*20)+'px';l.style.animationDuration=(2.2+Math.random()*2)+'s';l.style.animationDelay=(Math.random()*.6)+'s';document.body.appendChild(l);setTimeout(()=>l.remove(),5000);}}

/* ===================== 計算 ===================== */
const isDone=m=>{const v=S.done[m.id];if(!v)return false;if(m.type==='counter')return (v.n||0)>=m.goal;if(m.type==='num')return (v.n||0)>0;return true;};
const doneOrders=()=>ORDERS.filter(o=>S.orders[o.id]).length;
function secretOK(id){
 if(id==='s01')return MISSIONS.filter(m=>m.day===1&&m.id!=='m12').every(isDone);
 if(id==='s02')return !!S.quizPerfect;
 if(id==='s03')return doneOrders()>=4;
 if(id==='s04')return MISSIONS.every(isDone);
}
const owned=c=>c.kind==='m'?isDone(c):secretOK(c.id);
const MAXPT=MISSIONS.reduce((a,m)=>a+m.pt,0)+SECRETS.reduce((a,s)=>a+s.pt,0)+ORDERS.length*15+QUIZ.length*2;
function points(){let p=0;MISSIONS.forEach(m=>{if(isDone(m))p+=m.pt});SECRETS.forEach(s=>{if(secretOK(s.id))p+=s.pt});return p+doneOrders()*15+(S.quizBest||0)*2;}
function rank(p){const r=p/MAXPT;let n=RANKS[0][1];RANKS.forEach(([th,nm])=>{if(r>=th)n=nm});return n;}

   x.fillStyle='#2a2238';x.font=`800 30px ${FB}`;x.textAlign='center';x.fillText((it[i].e+' '+it[i].cap).slice(0,16),232,350);x.textAlign='left';}
  else{x.fillStyle='#efe6d8';x.fillRect(16,16,433,290);x.font='110px serif';x.textAlign='center';x.fillText('🍁',232,210);x.textAlign='left';}
  x.restore();}
 const tt=titles().filter(t=>t.on).map(t=>t.e+t.t).join('　');
 x.fillStyle='rgba(255,255,255,.08)';x.fillRect(50,1600,980,280);
 x.fillStyle='#ffc94a';x.font=`800 32px ${FB}`;wrap(x,tt?'🏅 '+tt:'🏅 称号なし',80,1650,920,44,2);
 x.fillStyle='#f4f1ea';x.font=`800 32px ${FB}`;const memo=S.done.m21?.text||S.done.m13?.text||'';if(memo)wrap(x,'「'+memo.replace(/\n/g,' ')+'」',80,1750,920,44,3);
 const data=c.toDataURL('image/jpeg',.9);
 openSheet(`<button class="x" data-close>✕</button><h2 class="dg" style="margin-top:2px">思い出カード</h2><img id="memImg" src="${data}"><div class="rsub" style="text-align:center;margin-top:10px">画像を<b>長押し</b> →「写真に保存」でカメラロールへ📱</div>`);}

/* ===================== 設定 ===================== */
let selAv=0,resetArm=false;
function openSetup(first){const s=S.setup||{name:'',av:AVATARS[0]};selAv=Math.max(0,AVATARS.indexOf(s.av));
 openSheet(`${first?'':'<button class="x" data-close>✕</button>'}<h2 class="dg" style="margin-top:2px">${first?'🍁 鬼怒川もみじクエスト':'⚙️ 設定'}</h2>
 ${first?'<div class="mdesc">旅行中のミッション・緊急指令・クイズでポイントをかせいで、カードと称号をあつめよう。最後に3人で結果発表！</div>':''}
 <div class="field"><label>アイコン</label><div class="avs">${AVATARS.map((a,i)=>`<button data-av="${i}" class="${i===selAv?'on':''}">${a}</button>`).join('')}</div></div>
 <div class="field"><label>プレイヤー名</label><input class="inp" id="fN" value="${esc(s.name)}" placeholder="ニックネームでOK" maxlength="10"></div>
 <button class="btn" data-savesetup>${first?'ゲームスタート！':'保存'}</button>
 ${first?'':`<div style="height:24px"></div><button class="btn sub" data-reset>🗑️ データを全部消す</button><div class="rsub" style="text-align:center;margin-top:8px">ためしに使ったら、本番前にリセットしてね</div>`}`);}

/* ===================== シート・画面 ===================== */
function openSheet(html,center){$('#sheet').innerHTML=html;$('#ov').classList.toggle('center',!!center);$('#ov').classList.add('on');$('#sheet').scrollTop=0;}
function closeSheet(){$('#ov').classList.remove('on');const n=pending.shift();if(!n)return;
 setTimeout(()=>{if(n.k==='card')reveal(n.id);else{openSheet(`<div style="font-size:70px">${n.t.e}</div><div class="rtitle dg">称号GET！</div><div style="font-size:22px;font-weight:800;margin:6px 0">${n.t.t}</div><div class="rsub">${esc(n.t.h)}を達成</div><button class="btn" data-close>OK</button>`,true);chime([659,784,1047,1319]);leaves(24,['🏅','✨']);}},250);}
let cur='plan';
function go(v){cur=v;document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#main').scrollTop=0;renderView(v);try{history.replaceState(null,'','#'+v)}catch(e){}}
function renderView(v){({plan:renderPlan,mission:renderMission,quiz:renderQuiz,zukan:renderZukan,album:renderAlbum})[v]();}
function renderAll(){renderHeader();renderView(cur);}

/* ===================== イベント ===================== */
document.addEventListener('click',async e=>{
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.v){go(d.v);return;}
 if('close' in d){closeSheet();return;}
 if(d.tab){mTab=+d.tab;renderMission();return;}
 if(d.goph){const m=MISSIONS.find(x=>x.ph===d.goph);mTab=m.day;go('mission');setTimeout(()=>{const el=document.getElementById('ph-'+d.goph);if(el)el.scrollIntoView({block:'start'})},60);return;}
 if(d.m){openMission(d.m);return;}
 if('shoot' in d){fileTarget=curM.id;$('#fileIn').click();return;}
 if('savetxt' in d){const v=$('#txt').value.trim();if(!v){toast('なにか書いてね');return;}const f=!isDone(curM);S.done[curM.id]={t:S.done[curM.id]?.t||Date.now(),text:v};save();checkNew();cleared(curM,f);return;}
 if(d.star){tmp.stars=+d.star;document.querySelectorAll('[data-star]').forEach(b=>b.classList.toggle('on',+b.dataset.star<=tmp.stars));return;}
 if('savereview' in d){const dish=$('#dish').value.trim(),tx=$('#txt').value.trim();if(!tmp.stars||!tx){toast('★とレビューを入れてね');return;}
  const f=!isDone(curM),hasPhoto=!!(await getPhoto(curM.id));S.done[curM.id]={t:S.done[curM.id]?.t||Date.now(),stars:tmp.stars,dish,text:tx,photo:hasPhoto};save();checkNew();cleared(curM,f);return;}
 if(d.cnt){const before=isDone(curM);tmp.n=Math.max(0,Math.min(30,tmp.n+ +d.cnt));$('#cntv').textContent=tmp.n;S.done[curM.id]={t:S.done[curM.id]?.t||Date.now(),n:tmp.n};if(!tmp.n)delete S.done[curM.id];save();checkNew();renderAll();
  if(!before&&isDone(curM)){reveal(curM.id);}else if(pending.length&&isDone(curM)){closeSheet();}return;}
 if('savenum' in d){const n=parseInt($('#num').value,10);if(!(n>0)){toast('記録を入れてね');return;}const f=!isDone(curM);S.done[curM.id]={t:S.done[curM.id]?.t||Date.now(),n};save();checkNew();cleared(curM,f);return;}
 if(d.card){showCard(d.card);return;}
 if(d.order){openOrder(d.order);return;}
 if(d.orderok){S.orders[d.orderok]=Date.now();save();checkNew();renderAll();openSheet(`<div style="font-size:70px">⚡</div><div class="rtitle dg">指令クリア！</div><div class="rsub">+15pt</div><button class="btn" data-close>OK</button>`,true);chime();leaves(24,['⚡','✨']);return;}
 if('qstart' in d){Q={i:0,ok:0,ans:null,list:shuffle(QUIZ).map(q=>({...q,order:shuffle([0,1,2,3])}))};renderQuiz();return;}
 if(d.qa!==undefined&&Q&&Q.ans==null){Q.ans=+d.qa;if(Q.ans===Q.list[Q.i].c){Q.ok++;chime([784,1047]);}else chime([300,220]);renderQuiz();return;}
 if('qnext' in d){Q.i++;Q.ans=null;if(Q.i>=Q.list.length)quizEnd();else{renderQuiz();$('#main').scrollTop=0;}return;}
 if('result' in d){showResult();return;}
 if('mem' in d){makeMemory();return;}
 if('free' in d){fileTarget='free';$('#fileIn').click();return;}
 if(d.photo){showPhoto(d.photo);return;}
 if(d.delfree){S.free=S.free.filter(f=>f.k!==d.delfree);save();closeSheet();renderAlbum();toast('消したよ');return;}
 if(d.av!==undefined){selAv=+d.av;document.querySelectorAll('[data-av]').forEach(b=>b.classList.toggle('on',b===t));return;}
 if('savesetup' in d){const n=$('#fN').value.trim();if(!n){toast('名前を入れてね');return;}const first=!S.setup;S.setup={name:n,av:AVATARS[selAv]};save();closeSheet();renderAll();if(first){leaves(30);chime();toast('🍁 ゲームスタート！');}return;}
 if('reset' in d){if(!resetArm){resetArm=true;t.textContent='⚠️ もう一度押すと全部消えます';setTimeout(()=>resetArm=false,4000);return;}
  resetArm=false;S=blank();save();await clearPhotos();Object.keys(urlCache).forEach(dropURL);pending=[];Q=null;closeSheet();renderAll();openSetup(true);return;}
 if(t.id==='gear'){openSetup(false);return;}
});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov'&&!$('#ov').classList.contains('center'))closeSheet();});

/* ===================== 起動 ===================== */
const h0=(location.hash||'').slice(1);if(['plan','mission','quiz','zukan','album'].includes(h0))cur=h0;
go(cur);renderHeader();if(!S.setup)openSetup(true);
let lastAct=activeOrder()?.id;
setInterval(()=>{const a=activeOrder()?.id;if(a&&a!==lastAct){toast('⚡ 緊急指令が発令された！');chime([880,660,880,660]);}lastAct=a;
 if(!$('#ov').classList.contains('on')&&(cur==='plan'||cur==='mission'))renderView(cur);},30000);
</script>
</body>
</html>
